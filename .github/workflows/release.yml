name: Release

# Triggers on every v*.*.* tag push, but that alone is NOT "this is a
# release" — see the check-version job below. A tag matching v*.*.* is
# necessary but not sufficient: the real signal is pom.xml's <version>
# being bumped to exactly match the tag (full X.Y.Z). A stray/reference
# tag that happens to match the pattern otherwise triggers a full
# build+publish for nothing. Pattern backported 2026-08-19 from
# mcp-service-catalog's release.yml, written 2026-08-13 after a real
# incident there (a docs-only tag matching an X.Y-only pom version check
# accidentally published a Release with nothing new in it).
#
# Note: infimg's own pom.xml <version> is X.Y (e.g. "1.5", no patch
# digit) while its git tags are full X.Y.Z (e.g. v1.5.0) — the compare
# step below normalizes both to X.Y before matching, unlike
# mcp-service-catalog's exact full-version compare, since infimg does
# not carry a third version digit in pom.xml.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.compare.outputs.is_release }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - id: compare
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_XY="${TAG_VERSION%.*}"
          POM_VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          echo "Tag: $GITHUB_REF_NAME -> expecting pom.xml version $TAG_XY (from $TAG_VERSION), found $POM_VERSION"
          if [ "$TAG_XY" = "$POM_VERSION" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $GITHUB_REF_NAME does not match pom.xml version ($POM_VERSION) — treating as a reference tag, not a release. Skipping build+publish."
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - uses: softprops/action-gh-release@v2
        with:
          files: target/infimg-*-jar-with-dependencies.jar
          generate_release_notes: true
